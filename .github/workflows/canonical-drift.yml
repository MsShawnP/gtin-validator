name: canonical-drift

# Fails the build if a retired Cinderhaven figure/string reaches a live surface.
# Tokens come from the vendored reference/supersedes.txt. See
# scripts/check_canonical_drift.py.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Canonical drift gate
        run: python scripts/check_canonical_drift.py
